name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: >-
        Right-click Solutions Builder.app, "Get Info", and copy the version
        number. If you're running from source, the commit hash instead.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      description: The app only ships for macOS right now.
      placeholder: e.g. 14.5
    validations:
      required: true
