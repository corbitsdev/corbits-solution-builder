name: Feature request
description: Ask for something the app doesn't do yet
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Why the current behaviour gets in the way
    validations:
      required: true
