<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a2b3c"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- page + card -->
  <rect x="0" y="0" width="1500" height="780" fill="#f5f6f7"/>
  <rect x="20" y="20" width="1460" height="720" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- header -->
  <path d="M78 58 l9 -14 l6 9 l5 -7 l8 12" fill="none" stroke="#1a2b3c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="114" y="60" font-size="16" font-weight="700" fill="#1a2b3c">Corbits</text>
  <line x1="196" y1="44" x2="196" y2="62" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="208" y="60" font-size="14" font-family="SF Mono, Menlo, Consolas, monospace" fill="#3f9e5f">02</text>
  <text x="238" y="61" font-size="20" font-weight="700" fill="#1a2b3c">Project Lifecycle &amp; Workflow</text>

  <!-- ===== Row A: birth + workflow engine + client ===== -->
  <text x="80" y="112" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="2" fill="#6b7280">LIFE OF A PROJECT</text>

  <rect x="80" y="122" width="240" height="70" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="200" y="151" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Project created</text>
  <text x="200" y="172" font-size="10.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">installer &#183; child tenant &#183; grants</text>
  <text x="80" y="212" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280">initProjectState &#183; fresh or snapshot revival</text>

  <line x1="320" y1="157" x2="356" y2="157" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="112" width="640" height="100" rx="12" fill="#eef3fa" stroke="#2d5a8e" stroke-width="1.5"/>
  <text x="380" y="136" font-size="12" font-weight="700" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="2" fill="#2d5a8e">WORKFLOW ENGINE &#183; ONE DURABLE LOOP</text>

  <rect x="380" y="150" width="64" height="30" rx="5" fill="#ffffff" stroke="#1a2b3c"/>
  <text x="412" y="169" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">init</text>
  <line x1="444" y1="165" x2="458" y2="165" stroke="#1a2b3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="460" y="150" width="110" height="30" rx="5" fill="#ffffff" stroke="#1a2b3c"/>
  <text x="515" y="169" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">name &#183; agent</text>
  <line x1="570" y1="165" x2="584" y2="165" stroke="#1a2b3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="586" y="150" width="64" height="30" rx="5" fill="#ffffff" stroke="#1a2b3c"/>
  <text x="618" y="169" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">hold</text>
  <line x1="650" y1="165" x2="664" y2="165" stroke="#1a2b3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="666" y="150" width="150" height="30" rx="5" fill="#ffffff" stroke="#1a2b3c"/>
  <text x="741" y="169" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">awaitSignal decision</text>
  <line x1="816" y1="165" x2="830" y2="165" stroke="#1a2b3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="832" y="150" width="140" height="30" rx="5" fill="#ffffff" stroke="#1a2b3c"/>
  <text x="902" y="169" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">applyDecision</text>

  <polyline points="902,180 902,196 618,196 618,182" fill="none" stroke="#1a2b3c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="640" y="208" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280">carry ProjectState &#183; while !done &#183; max 500 iterations</text>

  <rect x="1140" y="122" width="260" height="70" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1270" y="151" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">apps/web</text>
  <text x="1270" y="172" font-size="10.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">decide() &#183; view re-reads state</text>
  <line x1="1140" y1="157" x2="1004" y2="157" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1072" y="150" font-size="11" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1a2b3c" text-anchor="middle">project.decision</text>

  <!-- engine -> pipeline -->
  <line x1="680" y1="212" x2="680" y2="266" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="246" font-size="12" fill="#1a2b3c">applyDecision advances the stage &#183; a refused decision is recorded, state unchanged</text>

  <!-- ===== Stage pipeline container ===== -->
  <rect x="80" y="270" width="1320" height="330" rx="12" fill="#eef3fa" stroke="#2d5a8e" stroke-width="1.5"/>
  <text x="100" y="296" font-size="12" font-weight="700" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="2" fill="#2d5a8e">STAGE PIPELINE &#183; ENFORCED BY stageRules</text>
  <text x="1380" y="296" font-size="10.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="end">open_review &#8594; approve names exact artifact &#183; version &#183; sha256</text>

  <!-- row 1: stages 1-5 -->
  <rect x="110" y="312" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="220" y="332" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 1</text>
  <text x="220" y="354" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Problem discovery</text>
  <text x="220" y="372" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">stage.approve on open review</text>
  <text x="220" y="388" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">owner / technical approver</text>
  <line x1="330" y1="356" x2="366" y2="356" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="312" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="480" y="332" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 2</text>
  <text x="480" y="354" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Solution shape</text>
  <text x="480" y="372" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">stage.approve on open review</text>
  <text x="480" y="388" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">owner / technical approver</text>
  <line x1="590" y1="356" x2="626" y2="356" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="312" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="740" y="332" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 3</text>
  <text x="740" y="354" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Solution proposal</text>
  <text x="740" y="372" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">stage.approve on open review</text>
  <text x="740" y="388" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">owner / technical approver</text>
  <line x1="850" y1="356" x2="886" y2="356" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="890" y="312" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="1000" y="332" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 4</text>
  <text x="1000" y="354" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">GUI design</text>
  <text x="1000" y="372" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">stage.approve on open review</text>
  <text x="1000" y="388" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">owner / technical approver</text>
  <line x1="1110" y1="356" x2="1146" y2="356" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1150" y="312" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="1260" y="332" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 5</text>
  <text x="1260" y="354" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Concept approval</text>
  <text x="1260" y="372" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">audience votes &#183; record-only</text>
  <text x="1260" y="388" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">gate: quorum &#183; no blockers</text>

  <!-- elbow 5 -> 6 -->
  <polyline points="1260,400 1260,436 220,436 220,468" fill="none" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2: stages 6-9 + terminal -->
  <rect x="110" y="472" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="220" y="492" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 6</text>
  <text x="220" y="514" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Build plan</text>
  <text x="220" y="532" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">mint_requirements FR/NFR/IR/AC</text>
  <text x="220" y="548" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">gate: ## Stack cites minted ids</text>
  <line x1="330" y1="516" x2="366" y2="516" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="472" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="480" y="492" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 7</text>
  <text x="480" y="514" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Cost approval</text>
  <text x="480" y="532" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">cost.approve &#8594; build.freeze</text>
  <text x="480" y="548" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">freeze: immutable BuildPacket</text>
  <line x1="590" y1="516" x2="626" y2="516" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="472" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="740" y="492" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 8</text>
  <text x="740" y="514" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Build and test</text>
  <text x="740" y="532" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">attempts &#8594; evidence archive</text>
  <text x="740" y="548" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">gate: verifier report + human ok</text>
  <line x1="850" y1="516" x2="886" y2="516" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="890" y="472" width="220" height="88" rx="8" fill="#ffffff" stroke="#1a2b3c" stroke-width="1.5"/>
  <text x="1000" y="492" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#6b7280" text-anchor="middle">STAGE 9</text>
  <text x="1000" y="514" font-size="15" font-weight="700" fill="#1a2b3c" text-anchor="middle">Deliver</text>
  <text x="1000" y="532" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">deliver tool approval, then</text>
  <text x="1000" y="548" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280" text-anchor="middle">delivery.accept &#8594; done: true</text>
  <line x1="1110" y1="516" x2="1146" y2="516" stroke="#1a2b3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1150" y="472" width="220" height="88" rx="8" fill="#e3f3e8" stroke="#3f9e5f" stroke-width="1.5"/>
  <text x="1260" y="492" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" letter-spacing="1" fill="#1f6b3a" text-anchor="middle">END OF LIFE</text>
  <text x="1260" y="514" font-size="15" font-weight="700" fill="#1f6b3a" text-anchor="middle">Delivered</text>
  <text x="1260" y="532" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1f6b3a" text-anchor="middle">project.archive (owner)</text>
  <text x="1260" y="548" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1f6b3a" text-anchor="middle">delete = tombstone, no ledger</text>

  <!-- backtrack -->
  <text x="130" y="578" font-size="10.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#6b7280">send_back / route_back &#8594; backtracked &#183; stage.select_route reopens target &#183; stales reviews &#8805; target &#183; clears freeze / requirements / votes</text>
  <line x1="1150" y1="588" x2="130" y2="588" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5" marker-end="url(#arrowgray)"/>

  <!-- state note -->
  <text x="80" y="640" font-size="12" fill="#1a2b3c">ProjectState &#8212; stage &#183; reviews &#183; decisions &#183; freeze &#183; requirements &#183; audience policy &amp; votes &#8212; written only by the applyDecision reducer; a refusal is a recorded decision (20 codes), never an exception.</text>

  <!-- footer caption -->
  <text x="80" y="684" font-size="13" fill="#6b7280">One durable workflow drives the whole life of a project: the client only signals decisions, and the reducer alone advances stage 1 &#8594; 9.</text>
  <text x="80" y="704" font-size="13" fill="#6b7280">Client-side gates at stage 6 (Stack pre-check), 8 (evidence archive before review) and 9 (delivery tool approval) explain the rules early; they never replace them.</text>
</svg>
